name: ATF V2 Phases 35-42
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Python phase contract tests
        run: python3 tools/v2_phase_contract_runner.py
      - name: Run independent Go phase verifier
        run: go run ./reference/implementation/go/v2-final-conformance
