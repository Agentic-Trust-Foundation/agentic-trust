name: ATF V1 Conformance

on:
  push:
    branches: [main]
    paths:
      - "specs/v1/**"
      - "schemas/v1/**"
      - "test-vectors/v1/**"
      - "conformance/v1/**"
      - "reference/implementation/**"
      - ".github/workflows/atf-v1-conformance.yml"
  pull_request:
    paths:
      - "specs/v1/**"
      - "schemas/v1/**"
      - "test-vectors/v1/**"
      - "conformance/v1/**"
      - "reference/implementation/**"
      - ".github/workflows/atf-v1-conformance.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: pytest -q
